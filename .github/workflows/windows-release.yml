name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths: ['voyah_manager.py', 'build_exe.py', 'prepare_tools.py', 'requirements-build.txt', 'tools.lock.json', 'tests/**', '.github/workflows/windows-release.yml']
  pull_request:
    paths: ['voyah_manager.py', 'build_exe.py', 'prepare_tools.py', 'requirements-build.txt', 'tools.lock.json', 'tests/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the resulting EXE to Releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10' # Last CPython 3.12 Windows binary in setup-python manifest
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Fetch and verify Android and Java tools
        run: python prepare_tools.py
      - name: Run tests
        run: python -m pytest tests -s -q --junitxml=test-results.xml
      - name: Build directory distribution
        run: python build_exe.py --onedir --distpath staging
      - name: Verify directory distribution
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $app = Start-Process -FilePath 'staging/Voyah Manager/Voyah Manager.exe' -ArgumentList @('--demo','--bundled-adb','--smoke-dir','qa-onedir') -PassThru -Wait -WindowStyle Hidden
          $app.WaitForExit(); $app.Refresh()
          if ($app.ExitCode -ne 0) { Write-Output ('Directory exit code: '+$app.ExitCode); Get-Content "$env:LOCALAPPDATA/Voyah Manager/voyah-manager.log" -Tail 80 -ErrorAction SilentlyContinue; throw 'Directory EXE failed' }
          $report = Get-Content qa-onedir/report.json -Raw | ConvertFrom-Json
          if (-not $report.frozen -or $report.tabs -ne 8) { throw 'Invalid smoke report' }
          foreach ($tool in $report.tool_checks.PSObject.Properties) { if (-not $tool.Value.ok) { throw ('Bundled tool failed: '+$tool.Name) } }
      - name: Build onefile EXE
        run: python build_exe.py
      - name: Verify portable EXE and record SHA-256
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME,Env:PYTHONPATH,Env:JAVA_HOME -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath 'dist/Voyah Manager.exe' -ArgumentList @('--demo','--bundled-adb','--smoke-dir','qa-onefile') -PassThru -Wait -WindowStyle Hidden
          $app.WaitForExit(); $app.Refresh()
          if ($app.ExitCode -ne 0) { Write-Output ('Onefile exit code: '+$app.ExitCode); Get-Content "$env:LOCALAPPDATA/Voyah Manager/voyah-manager.log" -Tail 80 -ErrorAction SilentlyContinue; throw 'Onefile EXE failed' }
          $report = Get-Content qa-onefile/report.json -Raw | ConvertFrom-Json
          $sourceHash=(Get-FileHash voyah_manager.py -Algorithm SHA256).Hash.ToLower()
          if (-not $report.frozen -or $report.build.source_sha256 -ne $sourceHash) { throw 'Source provenance mismatch' }
          foreach ($tool in $report.tool_checks.PSObject.Properties) { if (-not $tool.Value.ok) { throw ('Bundled tool failed: '+$tool.Name) } }
          $hash=(Get-FileHash 'dist/Voyah Manager.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Voyah Manager.exe" | Set-Content 'dist/Voyah Manager.exe.sha256' -Encoding ascii
          Copy-Item build_manifest.json,README_RU.md,HARDWARE_CHECKLIST_RU.md,QA_REPORT_V21_RU.md,THIRD_PARTY_NOTICES.txt -Destination dist
          $suite=([xml](Get-Content test-results.xml -Raw)).testsuites.testsuite
          $facts="`n`n## Автоматическая проверка опубликованной сборки`n`nGitHub Actions: $env:GITHUB_RUN_ID. Проверок: $($suite.tests); ошибок: $($suite.errors); падений: $($suite.failures).`n`nEXE SHA-256: $hash`nSource SHA-256: $sourceHash`n`nВстроенные инструменты запущены из автономного EXE; соответствие исходнику подтверждено. Реальное ГУ не подключалось."
          Add-Content dist/QA_REPORT_V21_RU.md $facts -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            test-results.xml
            qa-onedir/
            qa-onefile/

  release:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: dist
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/build_manifest.json', 'utf8'));
            const tag = `v${manifest.version}`;
            const body = `Полный редизайн: единая палитра и контурные значки, компактное подключение, карточки приложений, инспектор по задачам, закреплённые действия и общий журнал с отменой. RU/EN, масштабирование и уменьшение анимации.\n\nАвтономный Windows x64 EXE со встроенными Python, Qt, ADB, AAPT2, bundletool и Java. Каталог: catalog.json в main. Отчёт проверок и SHA-256 приложены.\n\nСборка без цифровой подписи. Системные сценарии проверены на имитаторе, реальное ГУ не подключалось.\n\nSource SHA-256: ${manifest.source_sha256}\nCommit: ${context.sha}`;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name:tag, target_commitish:context.sha, name:`Voyah Manager ${manifest.version}`, body})).data;
            }
            const tagRef = (await github.rest.git.getRef({...context.repo, ref:`tags/${tag}`})).data;
            if (tagRef.object.sha !== context.sha) {
              // Finalise this initial 2.1.0 candidate after the final drop-input check.
              // Future changes to an already published version must bump its version.
              const initialCandidates = ['23eb061fe32a3c122bdec2e008516e229caade36', 'f93576bd78d49f040481c053007bcd7c334242f0'];
              if (tag !== 'v2.1.0' || !initialCandidates.includes(tagRef.object.sha))
                throw new Error('This version is already published from another commit. Bump the version.');
              await github.rest.git.updateRef({...context.repo, ref:`tags/${tag}`, sha:context.sha, force:true});
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id:release.id});
            for (const name of fs.readdirSync('dist')) {
              const existing = assets.find(asset => asset.name === name || asset.name === name.replaceAll(' ','.'));
              if (existing) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id:existing.id});
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id:release.id, name, data, headers:{'content-type':'application/octet-stream','content-length':data.length}});
            }
            await github.rest.repos.updateRelease({...context.repo, release_id:release.id, body, target_commitish:context.sha});
